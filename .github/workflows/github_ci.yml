name: CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  publishing:
    name: Publishing (Java ${{ matrix.java }} bytecode)
    runs-on: ubuntu-latest
    container:
      image: registry.altlinux.org/sisyphus/alt:latest
    strategy:
      matrix:
        java: [11, 17]

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            glibc-pthread \
            git \
            java-17-openjdk-devel

      - uses: actions/checkout@v4

      - name: Publish to Maven Local (Java ${{ matrix.java }} bytecode)
        run: |
          if [ "${{ matrix.java }}" = "11" ]; then
            ./gradlew publishToMavenLocal -Djava11
          else
            ./gradlew publishToMavenLocal
          fi

  tests:
    name: Tests (Java ${{ matrix.java }} bytecode)
    runs-on: ubuntu-latest
    container:
      image: registry.altlinux.org/sisyphus/alt:latest
    needs: publishing
    strategy:
      matrix:
        java: [11, 17]

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            glibc-pthread \
            git \
            google-gson \
            maven-lib \
            shadow-gradle-plugin \
            java-17-openjdk-devel

      - uses: actions/checkout@v4

      - name: Check (Java 11 bytecode)
        if: matrix.java == 11
        run: |
          ./gradlew build \
            -Djava11 \
            --info

      - name: Check (Java 17 bytecode)
        if: matrix.java != 11
        run: |
          ./gradlew build \
            --info

  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    container:
      image: registry.altlinux.org/sisyphus/alt:latest
    needs: tests

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            glibc-pthread \
            git \
            java-17-openjdk-devel
      - uses: actions/checkout@v4

      - name: Run checkstyle check
        run: ./gradlew checkstyle

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    container:
      image: registry.altlinux.org/sisyphus/alt:latest
    needs: tests

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            glibc-pthread \
            git \
            google-gson \
            maven-lib \
            shadow-gradle-plugin \
            java-17-openjdk-devel

      - uses: actions/checkout@v4

      - name: Run jacoco check
        run: |
          ./gradlew build jacocoTestReport

      - name: Add coverage to PR
        id: jacoco
        uses: ALonelyDuck/jacoco-report@v1.2
        with:
            paths: |
              ${{ github.workspace }}/**/build/reports/jacoco/test/jacocoTestReport.xml
            token: ${{ secrets.GITHUB_TOKEN }}
            min-coverage-overall: 80
            min-coverage-changed-files: 80
            title: Code Coverage

      - name: Fail PR if change coverage is less than 80%
        if: ${{ steps.jacoco.outputs.coverage-changed-percentage < 80.0 }}
        uses: actions/github-script@v6
        with:
          script: core.setFailed('Coverage of changed files is less than 80%!')

      # TODO improve code coverage to 80% and create step that fails PR lesser than 80% coverage-overall
